
name: Build iOS App

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - "project.yml"
      - ".github/workflows/ios-build.yml"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v7

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Genera progetto Xcode
        run: xcodegen generate

      - name: Compila app per simulatore iOS
        run: |
          xcodebuild \
            -project ZeroClickSecurity.xcodeproj \
            -scheme ZeroClickSecurity \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
