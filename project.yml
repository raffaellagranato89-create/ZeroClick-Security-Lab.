
name: ZeroClickSecurity

options:
  bundleIdPrefix: com.zeroclicksecurity
  deploymentTarget:
    iOS: "17.0"

targets:
  ZeroClickSecurity:
    type: application
    platform: iOS
    sources:
      - path: ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zeroclicksecurity.personal
        PRODUCT_NAME: ZeroClickSecurity
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Zero-Click Security
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

