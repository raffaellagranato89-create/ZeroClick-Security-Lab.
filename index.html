
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zero-Click Security Lab</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  padding: 20px;
}
.panel {
  background: #1e293b;
  padding: 20px;
  border-radius: 12px;
  margin: 15px 0;
}
input {
  box-sizing: border-box;
  width: 100%;
  padding: 13px;
  margin: 12px 0;
}
button {
  padding: 12px;
  border: 0;
  border-radius: 8px;
  margin: 4px;
  background: #16a34a;
  color: white;
  font-weight: bold;
}
#result, #history {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.stat {
  font-size: 22px;
  font-weight: bold;
}
</style>
</head>
<body>

<h1>🛡️ Zero-Click Security Lab</h1>
<p>Laboratorio didattico di sicurezza informatica</p>

<div class="panel">
<h2>Analisi automatica simulata</h2>
<input id="message" placeholder="Inserisci un messaggio di prova">
<button onclick="analyze()">Analizza</button>
<p id="result">In attesa di un test...</p>
</div>

<div class="panel">
<h2>Statistiche</h2>
<p>Analisi effettuate: <span class="stat" id="total">0</span></p>
<p>Input sospetti: <span class="stat" id="suspicious">0</span></p>
</div>

<div class="panel">
<h2>Registro eventi</h2>
<div id="history">Nessun evento registrato.</div>
<button onclick="clearHistory()">Cancella registro</button>
</div>

<script src="security.js"></script>

<script>
function analyze() {
  const message = document.getElementById("message").value;

  if (!message.trim()) {
    document.getElementById("result").textContent =
      "Inserisci un messaggio.";
    return;
  }

  const event = SecurityLab.analyze(message);

  document.getElementById("result").textContent =
    event.status === "SOSPESO"
    ? "⚠️ Input sospetto bloccato dalla simulazione."
    : "✅ Nessun indicatore sospetto rilevato.";

  updateDashboard();
}

function updateDashboard() {
  const report = SecurityLab.report();

  document.getElementById("total").textContent =
    report.total;

  document.getElementById("suspicious").textContent =
    report.suspicious;

  document.getElementById("history").textContent =
    report.history.map(e =>
      e.time + " | " + e.status + " | " + e.message
    ).join("\n") || "Nessun evento registrato.";
}

function clearHistory() {
  SecurityLab.clear();
  updateDashboard();
}
</script>

<div class="panel">
  <h2>🧪 Simulazione Zero-Click</h2>
  <p>Ambiente didattico isolato.</p>

  <button onclick="runSimulation()">
    Avvia simulazione
  </button>

  <div id="simulationResult"></div>
</div>

<script src="simulation.js"></script>

<script>
function runSimulation() {
  const stages = ZeroClickSimulation.run();

  document.getElementById("simulationResult").textContent =
    stages.map(stage =>
      stage.name + "\n" +
      stage.detail + "\n" +
      "Stato: " + stage.status
    ).join("\n\n");
}
</script>
</body>

</body>
</html>
